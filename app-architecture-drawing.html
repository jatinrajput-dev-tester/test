function el(name, attrs, parent){

function busPath(pts, r){

  return false;
}
function edgeIdsFor(flow){
  if (!flow) return null;
  var out = {};
  if (flow === "story") { for (var s=0;s<STORY.length;s++) out[STORY[s]] = 1; return out; }
  for (var j=0;j<EDGES.length;j++) if (EDGES[j].flow === flow) out[EDGES[j].id] = 1;
  return out;
}
function edgeMapForNode(nodeId){
  var out = {};
  for (var i=0;i<EDGES.length;i++) if (EDGES[i].f === nodeId || EDGES[i].t === nodeId) out[EDGES[i].id] = 1;
  return out;
}
function applyEdgeState(map){
  for (var i=0;i<EDGES.length;i++){
    var rec = store.edges[EDGES[i].id];
    if (!rec) continue;
    var on = map ? !!map[EDGES[i].id] : false;
    rec.g.style.opacity = map ? (on ? 1 : 0.05) : 0.4;
    rec.path.style.strokeWidth = on ? "2.9" : "1.7";
    rec.label.style.opacity = on ? 0.98 : 0;
    if (rec.badge) rec.badge.style.opacity = on ? 1 : 0;
  }
}
function setFilter(flow){
  activeFlow = flow;
  applyEdgeState(edgeIdsFor(flow));
  var chips = document.querySelectorAll(".chip");
  for (var i=0;i<chips.length;i++){
    chips[i].setAttribute("aria-pressed", chips[i].getAttribute("data-flow") === flow ? "true" : "false");
  }
}
/* ------------------------------------------------------- pan, zoom, fit */
var stage = document.getElementById("stage");
var view = { x:0, y:0, k:1 };
var dragging = false, lastPt = null;

function apply(){
  if (store.scene) store.scene.setAttribute("transform", "translate(" + view.x + " " + view.y + ") scale(" + view.k + ")");
}
function fit(){
  var r = stage.getBoundingClientRect();
  var pad = 48, headroom = 92, reserved = r.width > 1300 ? 330 : 0, avail = r.width - reserved;
  var k = Math.min((avail - pad*2) / W, (r.height - headroom - pad) / H);
  k = Math.max(0.12, Math.min(k, 1.5));
  view.k = k;
  view.x = (avail - W*k) / 2;
  view.y = headroom + (r.height - headroom - H*k) / 2;
  apply();
}

stage.addEventListener("wheel", function(ev){
  ev.preventDefault();
  var r = stage.getBoundingClientRect();
  var mx = ev.clientX - r.left, my = ev.clientY - r.top;
  var nk = Math.max(0.12, Math.min(3.2, view.k * Math.exp(-ev.deltaY * 0.0016)));
  var s = nk / view.k;
  view.x = mx - (mx - view.x) * s;
  view.y = my - (my - view.y) * s;
  view.k = nk;
  apply();
}, { passive:false });

stage.addEventListener("pointerdown", function(ev){
  dragging = true; dragMoved = false;
  lastPt = { x:ev.clientX, y:ev.clientY };
  stage.classList.add("dragging");
  try { stage.setPointerCapture(ev.pointerId); } catch(err) {}
});
stage.addEventListener("pointermove", function(ev){
  if (!dragging || !lastPt) return;
  var dx = ev.clientX - lastPt.x, dy = ev.clientY - lastPt.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
  view.x += dx; view.y += dy;
  lastPt = { x:ev.clientX, y:ev.clientY };
  apply();
});
function endDrag(){ dragging = false; lastPt = null; stage.classList.remove("dragging"); }
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("click", function(){ if (!dragMoved) closePanel(); });

/* --------------------------------------------------------------- exports */
function cloneForExport(){
  var c = store.svg.cloneNode(true);
  c.setAttribute("width", W);
  c.setAttribute("height", H);
  c.setAttribute("viewBox", "0 0 " + W + " " + H);
  var sc = c.querySelector("#scene");
  if (sc) { sc.setAttribute("transform", "translate(0 0) scale(1)"); sc.removeAttribute("style"); }
  return c;
}
function download(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function exportSVG(){
  var src = new XMLSerializer().serializeToString(cloneForExport());
  var blob = new Blob(["<?xml version=\"1.0\" encoding=\"UTF-8\"?>" + "\n" + src], { type:"image/svg+xml;charset=utf-8" });
  download(blob, "how-hatch-works.svg");
}
function exportPNG(){
  var src = new XMLSerializer().serializeToString(cloneForExport());
  var blob = new Blob([src], { type:"image/svg+xml;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var img = new Image();
  img.onload = function(){
    var scale = 2;
    var c = document.createElement("canvas");
    c.width = W * scale; c.height = H * scale;
    var g = c.getContext("2d");
    g.fillStyle = "#fbfbfd";
    g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(function(b){ if (b) download(b, "how-hatch-works.png"); }, "image/png");
  };
  img.onerror = function(){ URL.revokeObjectURL(url); };
  img.src = url;
}

/* ------------------------------------------------------------------ init */
(function init(){
  stage.style.userSelect = "none";
  var built = buildScene();
  store.svg = built.svg;
  store.scene = built.scene;
  stage.appendChild(built.svg);

  drawEdges(built.scene, store);
  drawNodes(built.scene, store);
  placeBadges(store);

  EDGES.forEach(function(e){
    var rec = store.edges[e.id];
    if (!rec) return;
    rec.g.addEventListener("click", function(ev){
      ev.stopPropagation();
      if (!dragMoved) openEdge(e.id);
    });
  });

  buildChips(); setFilter("story"); paint(); openPanel();
  fit();

  document.getElementById("fit").addEventListener("click", fit);
  document.getElementById("svgBtn").addEventListener("click", exportSVG);
  document.getElementById("pngBtn").addEventListener("click", exportPNG);
  document.getElementById("close").addEventListener("click", closePanel);
  document.getElementById("techBtn").addEventListener("click", function(){ setTech(!showTech); });
  window.addEventListener("resize", function(){ if (!dragging) fit(); });
  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape") closePanel();
    if (ev.key === "f" || ev.key === "F") fit();
  });
})();
</script>
